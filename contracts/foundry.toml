[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Base (OP Stack) has supported Cancun opcodes since the Ecotone upgrade, and
# OpenZeppelin 5.7 emits `mcopy`. Paris would refuse to compile it.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false

# Remappings live in remappings.txt

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
