[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Base (OP Stack) has supported Cancun opcodes since the Ecotone upgrade, and
# OpenZeppelin 5.7 emits `mcopy`. Paris would refuse to compile it.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false

# Remappings live in remappings.txt

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Explorer verification. One Etherscan V2 key covers Base; export it as
# ETHERSCAN_API_KEY so `forge script --verify` and `forge verify-contract`
# both pick it up without the key appearing on the command line.
[etherscan]
base-sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
